<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4a5c"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a96a3"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#3a4a5c;stroke-width:1.4;rx:8}
      .t{font-weight:700;fill:#1d2733}
      .s{fill:#4d5b6a;font-size:11.5px}
      .flow{stroke:#3a4a5c;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke:#8a96a3;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#d)}
      .lbl{fill:#3a4a5c;font-size:11px}
    </style>
  </defs>
  <rect width="1180" height="700" fill="#fbfbfc"/>
  <text x="24" y="34" font-size="20" class="t">The Archivist: cloud deployment architecture</text>
  <text x="24" y="54" class="s">Destiny lore RAG (Milestone 2) on Google Cloud Run · model served by the UNC AI Gateway (Azure OpenAI)</text>

  <!-- user -->
  <rect x="24" y="250" width="140" height="74" class="box"/>
  <text x="94" y="279" text-anchor="middle" class="t">Player / grader</text>
  <text x="94" y="297" text-anchor="middle" class="s">browser page or</text>
  <text x="94" y="312" text-anchor="middle" class="s">POST /ask client</text>

  <!-- GCP boundary -->
  <rect x="200" y="78" width="690" height="600" rx="14" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.4"/>
  <text x="216" y="100" class="t" fill="#2f5d99">Google Cloud · project archivist-790-hh · us-east1</text>

  <!-- Cloud Run -->
  <rect x="230" y="116" width="420" height="368" rx="12" fill="#ffffff" stroke="#4a7ab8" stroke-width="1.6"/>
  <text x="246" y="140" class="t">Cloud Run service "archivist"</text>
  <text x="246" y="157" class="s">HTTPS · autoscaling 0–5 instances · concurrency 20 · 1 vCPU / 1 GiB</text>
  <text x="246" y="172" class="s">revisions = zero-downtime deploys · startup probe /ready · liveness /health</text>

  <!-- instance stack -->
  <rect x="262" y="194" width="372" height="276" rx="10" fill="#f3f6fa" stroke="#9fb3c8"/>
  <rect x="256" y="188" width="372" height="276" rx="10" fill="#f3f6fa" stroke="#9fb3c8"/>
  <rect x="250" y="182" width="372" height="276" rx="10" fill="#ffffff" stroke="#6f8aa8"/>
  <text x="264" y="202" class="s" font-weight="700">container instance (non-root, from Artifact Registry)</text>

  <rect x="266" y="212" width="340" height="34" class="box"/>
  <text x="436" y="234" text-anchor="middle" class="t">FastAPI app.py · /ask /health /ready /metrics</text>
  <rect x="266" y="256" width="340" height="34" class="box"/>
  <text x="436" y="272" text-anchor="middle" class="t">1 Input guard</text>
  <text x="436" y="285" text-anchor="middle" class="s">length cap · regex patterns · LLM classifier</text>
  <rect x="266" y="300" width="340" height="34" class="box"/>
  <text x="436" y="316" text-anchor="middle" class="t">2 Retrieval: Chroma index baked into image</text>
  <text x="436" y="329" text-anchor="middle" class="s">9,222 chunks · no network hop</text>
  <rect x="266" y="344" width="340" height="34" class="box"/>
  <text x="436" y="366" text-anchor="middle" class="t">3 Sanitize chunks + &lt;passage&gt; delimiters</text>
  <rect x="266" y="388" width="340" height="28" class="box"/>
  <text x="436" y="407" text-anchor="middle" class="t">4 Generate answer</text>
  <rect x="266" y="424" width="340" height="28" class="box"/>
  <text x="436" y="443" text-anchor="middle" class="t">5 Output filter · canary · PII redaction</text>
  <line x1="436" y1="246" x2="436" y2="255" class="flow"/>
  <line x1="436" y1="290" x2="436" y2="299" class="flow"/>
  <line x1="436" y1="334" x2="436" y2="343" class="flow"/>
  <line x1="436" y1="378" x2="436" y2="387" class="flow"/>
  <line x1="436" y1="416" x2="436" y2="423" class="flow"/>

  <!-- user arrows -->
  <path d="M164,276 L229,276" class="flow"/>
  <text x="170" y="256" class="lbl">HTTPS +</text>
  <text x="170" y="270" class="lbl">token</text>
  <path d="M229,300 L164,300" class="flow"/>
  <text x="170" y="318" class="lbl">answer,</text>
  <text x="170" y="332" class="lbl">citations</text>

  <!-- side services -->
  <rect x="680" y="128" width="190" height="58" class="box"/>
  <text x="775" y="152" text-anchor="middle" class="t">Secret Manager</text>
  <text x="775" y="170" text-anchor="middle" class="s">UNC key · access token</text>
  <path d="M680,160 L651,170" class="dash"/>

  <rect x="680" y="200" width="190" height="58" class="box"/>
  <text x="775" y="224" text-anchor="middle" class="t">Artifact Registry</text>
  <text x="775" y="242" text-anchor="middle" class="s">private image · Trivy-scanned</text>
  <path d="M680,230 L651,236" class="dash"/>

  <rect x="680" y="272" width="190" height="58" class="box"/>
  <text x="775" y="296" text-anchor="middle" class="t">Service account</text>
  <text x="775" y="314" text-anchor="middle" class="s">archivist-run (least privilege)</text>
  <path d="M680,300 L651,300" class="dash"/>

  <!-- observability -->
  <rect x="230" y="510" width="200" height="62" class="box"/>
  <text x="330" y="535" text-anchor="middle" class="t">Cloud Logging</text>
  <text x="330" y="553" text-anchor="middle" class="s">1 JSON line per question</text>
  <path d="M330,484 L330,509" class="flow"/>

  <rect x="460" y="510" width="200" height="62" class="box"/>
  <text x="560" y="531" text-anchor="middle" class="t">7 log-based metrics</text>
  <text x="560" y="548" text-anchor="middle" class="s">latency · cost · tokens · blocks</text>
  <text x="560" y="562" text-anchor="middle" class="s">by layer · cache hits · errors</text>
  <path d="M430,541 L459,541" class="flow"/>

  <rect x="460" y="596" width="200" height="66" class="box"/>
  <text x="560" y="619" text-anchor="middle" class="t">Cloud Monitoring</text>
  <text x="560" y="637" text-anchor="middle" class="s">12-chart dashboard</text>
  <text x="560" y="652" text-anchor="middle" class="s">6 alert policies</text>
  <path d="M560,572 L560,595" class="flow"/>

  <rect x="690" y="604" width="180" height="50" class="box"/>
  <text x="780" y="626" text-anchor="middle" class="t">Email alert</text>
  <text x="780" y="643" text-anchor="middle" class="s">links to RUNBOOK.md</text>
  <path d="M660,629 L689,629" class="flow"/>

  <rect x="230" y="596" width="200" height="66" class="box"/>
  <text x="330" y="619" text-anchor="middle" class="t">Cloud Run metrics</text>
  <text x="330" y="637" text-anchor="middle" class="s">instances · cold starts · 5xx</text>
  <text x="330" y="652" text-anchor="middle" class="s">CPU · memory</text>
  <path d="M430,629 L459,629" class="flow"/>

  <!-- gateway -->
  <rect x="930" y="250" width="226" height="118" rx="12" fill="#f4f0fb" stroke="#7a5bb5" stroke-width="1.6"/>
  <text x="1043" y="276" text-anchor="middle" class="t" fill="#4b2f86">UNC AI Gateway</text>
  <text x="1043" y="294" text-anchor="middle" class="s">Azure API Management →</text>
  <text x="1043" y="309" text-anchor="middle" class="s">Azure OpenAI</text>
  <text x="1043" y="330" text-anchor="middle" class="s">gpt-4.1-mini</text>
  <text x="1043" y="346" text-anchor="middle" class="s">text-embedding-3-small</text>
  <path d="M606,272 C780,272 820,280 929,290" class="flow"/>
  <path d="M606,402 C780,402 840,350 929,335" class="flow"/>
  <text x="1043" y="390" text-anchor="middle" class="lbl">calls: classifier · query embedding ·</text>
  <text x="1043" y="404" text-anchor="middle" class="lbl">generation (OpenAI-compatible API)</text>

  <!-- local tooling -->
  <rect x="930" y="430" width="226" height="102" rx="12" fill="#f6f8f2" stroke="#6f8f4e" stroke-width="1.4"/>
  <text x="1043" y="455" text-anchor="middle" class="t" fill="#3f5a26">Developer laptop</text>
  <text x="1043" y="473" text-anchor="middle" class="s">docker buildx (amd64) · Trivy</text>
  <text x="1043" y="489" text-anchor="middle" class="s">deploy/*.sh · load_test.py</text>
  <text x="1043" y="505" text-anchor="middle" class="s">MLflow (mlflow.db)</text>
  <text x="1043" y="519" text-anchor="middle" class="s">pushes image → Artifact Registry</text>

  <rect x="930" y="560" width="226" height="94" rx="12" fill="#fff8ef" stroke="#c98a2c" stroke-width="1.4"/>
  <text x="1043" y="585" text-anchor="middle" class="t" fill="#8a5a12">Kubernetes version</text>
  <text x="1043" y="603" text-anchor="middle" class="s">k8s/archivist.yaml, same image:</text>
  <text x="1043" y="619" text-anchor="middle" class="s">Deployment, Service, autoscaler</text>
  <text x="1043" y="635" text-anchor="middle" class="s">(CPU + questions in flight)</text>
</svg>
