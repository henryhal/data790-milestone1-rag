# kubectl apply -k k8s/          (any cluster: GKE, AKS, EKS, or Docker Desktop's built-in Kubernetes)
# Create the secret first (never commit a real one):
#   kubectl create namespace archivist
#   kubectl -n archivist create secret generic archivist-secrets \
#       --from-literal=UNC_AI_API_KEY="$UNC_AI_API_KEY" --from-literal=APP_ACCESS_TOKEN="$APP_ACCESS_TOKEN"
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: archivist
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
images:
  - name: archivist                     # placeholder used in deployment.yaml
    newName: us-east1-docker.pkg.dev/PROJECT_ID/archivist/archivist
    newTag: v1
