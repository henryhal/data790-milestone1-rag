# How users reach the Service from outside the cluster (needs an ingress controller, e.g. ingress-nginx
# or GKE's built-in one). Only /, /ask and the health checks are exposed; /metrics stays internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archivist
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "5"          # per-client rate limit: each question costs money
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - {path: /ask,    pathType: Exact,  backend: {service: {name: archivist, port: {name: http}}}}
          - {path: /health, pathType: Exact,  backend: {service: {name: archivist, port: {name: http}}}}
          - {path: /,       pathType: Exact,  backend: {service: {name: archivist, port: {name: http}}}}
